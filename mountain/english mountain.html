     <script>
// --------------------------------------------------
// 言葉の意味を管理するデータ（辞書）
// --------------------------------------------------
const wordMeanings = {
    "山笑う": "Yama warau.\nMountains look bright and lively in spring when new leaves and flowers begin to grow.",
    "風林火山": "Fuurin kazan.\nIt is important to act quickly when needed, stay hidden when needed, attack strongly, and remain calm and steady.",
    "塵も積もりて山となる": "Chiri mo tsumorite yama to naru.\nEven small things can become great when they are gathered together over time.",
    "さわさわ": "Sawasawa.\nA soft sound made when thin or light things gently touch or move against each other.",
    "ニョキニョキ": "Nyoki nyoki.\nLong, thin things appearing or growing one after another.",
    "山背": "Yamase.\nA wind that blows over the mountains. It can also mean a cool northeast wind that blows along the Pacific coast of northeastern Japan in summer.",
    "大山鳴動して鼠一匹": "Taizan meidou shite nezumi ippiki.\nA big commotion leads to a very small result.",
    "船頭多くして船山に上る": "Sendou ooku shite fune yama ni noboru.\nWhen too many people give instructions, things can go wrong and end up in the wrong direction.",
    "泰山北斗": "Taizan hokuto.\nA person who is highly respected and admired in a particular field.",
    "山高きが故に貴からず": "Yama takaki ga yue ni tattokarazu.\nWhat matters is not how something looks, but what it is really like inside.",
    "山眠る": "Yama nemuru.\nMountains look quiet and still in winter.",
};

// 要素の取得
const dialog = document.getElementById('meaning-dialog');
const dialogWord = document.getElementById('dialog-word');
const dialogText = document.getElementById('dialog-text');
const closeBtn = document.getElementById('close-btn');
const wordElements = document.querySelectorAll('.words');

// 各言葉にクリックイベントを設定
wordElements.forEach(element => {
    element.addEventListener('click', () => {
        const wordName = element.getAttribute('data-word'); // 属性から言葉を取得
        const meaning = wordMeanings[wordName] || "意味が登録されていません。";

        // モーダルに文字と意味を流し込む
        dialogWord.textContent = wordName;
        dialogText.textContent = meaning;

        // モーダルを表示（<dialog>タグの標準機能）
        dialog.showModal();
    });
});

// 「閉じる」ボタンが押されたらモーダルを閉じる
closeBtn.addEventListener('click', () => {
    dialog.close();
});

// モーダルの外側（背景）をクリックしたときにも閉じたい場合
dialog.addEventListener('click', (event) => {
    const rect = dialog.getBoundingClientRect();
    if (
        event.clientX < rect.left ||
        event.clientX > rect.right ||
        event.clientY < rect.top ||
        event.clientY > rect.bottom
    ) {
        dialog.close();
    }
});
    </script>

<script>
var audio = document.getElementById('audio');
audio.volume = 0.5;

var volumeControl = document.getElementById('volume-control');

document.getElementById('play-sound').addEventListener('click', function() {
    audio.play();
});

document.getElementById('stop-sound').addEventListener('click', function() {
    audio.pause();
});

document.getElementById('restart-sound').addEventListener('click', function() {
    audio.currentTime = 0;
    audio.play();
});

volumeControl.addEventListener('input', function() {
    audio.volume = volumeControl.value;
});
</script>


 <!-- 効果音 -->
<script>
    const stage = document.getElementById('stage');
    let currentBg = null;

    // 1. 【音声の準備】デフォルトの音と、bg1〜bg4に対応する音をそれぞれ定義する
    // ※ファイル名は実際の音声ファイル名に書き換えてください
    const sounds = {
        default: new Howl({ src: ["00mountain.mp3"], loop: true, volume: 0.2 }),
        bg1: new Howl({ src: ["mountain spring.mp3"], loop: true, volume: 0.2 }),   // 春の音
        bg2: new Howl({ src: ["mountain summer.mp3"], loop: true, volume: 0.2 }),   // 夏の音
        bg3: new Howl({ src: ["mountain autumn.mp3"], loop: true, volume: 0.2 }),   // 秋の音
        bg4: new Howl({ src: ["mountain winter.mp3"], loop: true, volume: 0.1 })    // 冬の音
    };

    // 現在再生中の音を管理する変数
    let activeSound = sounds.default;

    // 音声を切り替える関数
    function switchSound(targetKey) {
        // すべての音をいったん停止する
        Object.values(sounds).forEach(sound => sound.stop());

        // 指定されたテーマの音を選ぶ（なければデフォルト）
        const nextSound = sounds[targetKey] || sounds.default;
        
        // 音を再生して、アクティブ音を更新
        nextSound.play();
        activeSound = nextSound;
    }

    // 2. 背景と音声を同時に適用する関数
    function applyBackground(target) {
        if (!target) return;
        
        // 背景クラスの切り替え
        stage.classList.remove('bg1', 'bg2', 'bg3', 'bg4');
        stage.classList.add(target);
        currentBg = target;

        // 【連動】音声の切り替え
        switchSound(target);
    }

    // 3. 背景と音声を元に戻す関数（モーダルが開いていない場合のみ）
    function removeBackground(target) {
        if (!dialog.hasAttribute('open')) {
            stage.classList.remove('bg1', 'bg2', 'bg3', 'bg4');
            currentBg = null;

            // 【連動】音声をデフォルトに戻す
            switchSound('default');
        }
    }

    // 各言葉にイベントを設定
    wordElements.forEach(item => {
        let target = item.dataset.target;

        // マウスが乗ったとき
        item.addEventListener('mouseenter', () => {
            applyBackground(target);  
        });

        // マウスが離れたとき
        item.addEventListener('mouseleave', () => {
            removeBackground(target); 
        });

        // 言葉をクリックした時
        item.addEventListener('click', () => {
            applyBackground(target);
        });
    });

    // モーダルを閉じた時、背景と音声をリセットする
    function closeModalAndReset() {
        dialog.close();
        stage.classList.remove('bg1', 'bg2', 'bg3', 'bg4');
        currentBg = null;
        switchSound('default'); // デフォルトの音に戻す
    }

    closeBtn.addEventListener('click', closeModalAndReset);

    // モーダルの外側をクリックして閉じたとき
    dialog.addEventListener('click', (event) => {
        const rect = dialog.getBoundingClientRect();
        if (
            event.clientX < rect.left ||
            event.clientX > rect.right ||
            event.clientY < rect.top ||
            event.clientY > rect.bottom
        ) {
            closeModalAndReset();
        }
    });

    // 4. 【スタートボタン（レイヤー）の処理】
    // 最初は音を鳴らさず、ボタンを押したタイミングでデフォルト音を再生可能にする
    const playButton = document.getElementById("playButton");
    const layer = document.querySelector(".layer");

    playButton.addEventListener("click", () => {
        // デフォルト音の再生開始
        sounds.default.play();
        layer.style.display = "none";
    });


    document.getElementById('play-sound').addEventListener('click', function() {
    audio.play();
});

document.getElementById('stop-sound').addEventListener('click', function() {
    audio.pause();
});
</script>
