<dialog id="meaning-dialog">

    <!-- 言葉 -->
<div class="words-container" id="wordsContainer">
    <span class="words" data-target="bg1" data-word="山笑う" style="left: 10%; top: 10%;">山笑う</span>
    <span class="words" data-target="bg3" data-word="風林火山" style="left: 70%; top: 20%;">風林火山</span>

    <span class="words" data-target="bg4" data-word="大山鳴動して鼠一匹" style="left: 30%; top: 60%;">大山鳴動して鼠一匹</span>
    <span class="words" data-target="bg1" data-word="泰山北斗" style="left: 44%; top: 80%;">泰山北斗</span>
    <span class="words" data-target="bg1" data-word="ニョキニョキ" style="left: 70%; top: 75%;">ニョキニョキ</span>
    <span class="words" data-target="bg2" data-word="山高きが故に貴からず" style="left: 20%; top: 30%;">山高きが故に貴からず</span>
    <span class="words" data-target="bg4" data-word="山眠る" style="left: 10%; top: 70%;">山眠る</span>
</div>



     <script>
// --------------------------------------------------
// 言葉の意味を管理するデータ（辞書）
// --------------------------------------------------
const wordMeanings = {
    "山笑う": "ヤマワラウ：春の山の草木が一斉に若芽を吹いて、明るい感じになるようすをいう。",
    "風林火山": "フウリンカザン：状況の変化に合わせて、素早く動き、気配を消して潜み、激しく攻め込み、決して動じないという、緩急自在で隙のない対応が肝要であるという意。",
    "塵も積もりて山となる": "チリモツモリテヤマトナル：ごくわずかなものでも数多く積み重なれば高大なものになるということのたとえ。",
    "さわさわ": "薄いものなどが軽く触れてたてる音を表す語。",
    "ニョキニョキ": "細長い物が次々に現れ出るさま。",
    "山背": "ヤマセ：山を越えて吹いてくる風。また、夏、東北地方の太平洋岸に吹く冷涼な北東風",
    "大山鳴動して鼠一匹": "タイザンメイドウシテネズミイッピキ：前ぶれの騒ぎばかりが大きくて、実際の結果はきわめて小さいことのたとえ",
    "船頭多くして船山に上る": "センドウオクシテフネヤマニノボル：指図する人間が多いために統一がとれず、見当違いの方向に物事が進んでしまうたとえ。",
    "泰山北斗": "タイサンホクトウ：ある一つの道でもっとも高く仰ぎ尊ばれる人。",
    "山高きが故に貴からず": "ヤママタキガユエニタットカラズ：外観よりも実質が大切であることのたとえ。",
    "山眠る": "ヤマネムル：冬の山の静まり返ったようすをいう。",
};

// 要素の取得
const dialog = document.getElementById('meaning-dialog');
const dialogWord = document.getElementById('dialog-word');
const dialogText = document.getElementById('dialog-text');
const closeBtn = document.getElementById('close-btn');
const wordElements = document.querySelectorAll('.words');

// 各言葉にクリックイベントを設定
wordElements.forEach(element => {
    element.addEventListener('click', () => {
        const wordName = element.getAttribute('data-word'); // 属性から言葉を取得
        const meaning = wordMeanings[wordName] || "意味が登録されていません。";

        // モーダルに文字と意味を流し込む
        dialogWord.textContent = wordName;
        dialogText.textContent = meaning;

        // モーダルを表示（<dialog>タグの標準機能）
        dialog.showModal();
    });
});

// 「閉じる」ボタンが押されたらモーダルを閉じる
closeBtn.addEventListener('click', () => {
    dialog.close();
});

// モーダルの外側（背景）をクリックしたときにも閉じたい場合
dialog.addEventListener('click', (event) => {
    const rect = dialog.getBoundingClientRect();
    if (
        event.clientX < rect.left ||
        event.clientX > rect.right ||
        event.clientY < rect.top ||
        event.clientY > rect.bottom
    ) {
        dialog.close();
    }
});
    </script>

 <!-- 効果音 -->
    <div class="layer">
        <button id="playButton" class="close-btn">このページでは音が流れます</button>
    </div>
 <!-- 効果音 -->
<script>
    const stage = document.getElementById('stage');
    let currentBg = null;

    // 1. 【音声の準備】デフォルトの音と、bg1〜bg4に対応する音をそれぞれ定義する
    // ※ファイル名は実際の音声ファイル名に書き換えてください
    const sounds = {
        default: new Howl({ src: ["00mountain.mp3"], loop: true, volume: 0.2 }),
        bg1: new Howl({ src: ["mountain spring.mp3"], loop: true, volume: 0.2 }),   // 春の音
        bg2: new Howl({ src: ["mountain summer.mp3"], loop: true, volume: 0.2 }),   // 夏の音
        bg3: new Howl({ src: ["mountain autumn.mp3"], loop: true, volume: 0.2 }),   // 秋の音
        bg4: new Howl({ src: ["mountain winter.mp3"], loop: true, volume: 0.1 })    // 冬の音
    };

    // 現在再生中の音を管理する変数
    let activeSound = sounds.default;

    // 音声を切り替える関数
    function switchSound(targetKey) {
        // すべての音をいったん停止する
        Object.values(sounds).forEach(sound => sound.stop());

        // 指定されたテーマの音を選ぶ（なければデフォルト）
        const nextSound = sounds[targetKey] || sounds.default;
        
        // 音を再生して、アクティブ音を更新
        nextSound.play();
        activeSound = nextSound;
    }

    // 2. 背景と音声を同時に適用する関数
    function applyBackground(target) {
        if (!target) return;
        
        // 背景クラスの切り替え
        stage.classList.remove('bg1', 'bg2', 'bg3', 'bg4');
        stage.classList.add(target);
        currentBg = target;

        // 【連動】音声の切り替え
        switchSound(target);
    }

    // 3. 背景と音声を元に戻す関数（モーダルが開いていない場合のみ）
    function removeBackground(target) {
        if (!dialog.hasAttribute('open')) {
            stage.classList.remove('bg1', 'bg2', 'bg3', 'bg4');
            currentBg = null;

            // 【連動】音声をデフォルトに戻す
            switchSound('default');
        }
    }

    // 各言葉にイベントを設定
    wordElements.forEach(item => {
        let target = item.dataset.target;

        // マウスが乗ったとき
        item.addEventListener('mouseenter', () => {
            applyBackground(target);  
        });

        // マウスが離れたとき
        item.addEventListener('mouseleave', () => {
            removeBackground(target); 
        });

        // 言葉をクリックした時
        item.addEventListener('click', () => {
            applyBackground(target);
        });
    });

    // モーダルを閉じた時、背景と音声をリセットする
    function closeModalAndReset() {
        dialog.close();
        stage.classList.remove('bg1', 'bg2', 'bg3', 'bg4');
        currentBg = null;
        switchSound('default'); // デフォルトの音に戻す
    }

    closeBtn.addEventListener('click', closeModalAndReset);

    // モーダルの外側をクリックして閉じたとき
    dialog.addEventListener('click', (event) => {
        const rect = dialog.getBoundingClientRect();
        if (
            event.clientX < rect.left ||
            event.clientX > rect.right ||
            event.clientY < rect.top ||
            event.clientY > rect.bottom
        ) {
            closeModalAndReset();
        }
    });

    // 4. 【スタートボタン（レイヤー）の処理】
    // 最初は音を鳴らさず、ボタンを押したタイミングでデフォルト音を再生可能にする
    const playButton = document.getElementById("playButton");
    const layer = document.querySelector(".layer");

    playButton.addEventListener("click", () => {
        // デフォルト音の再生開始
        sounds.default.play();
        layer.style.display = "none";
    });
</script>
