<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雨 -一字の扉-</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="雨.css">
</head>
<body>

    <div class="opening-title" style="display: none;"></div>
    <div class="opening-door-container">
        <div class="door door-left"></div>
        <div class="door door-right"></div>
    </div>

    <div class="menu-trigger" id="menuTrigger">
        <span></span>
        <span></span>
    </div>

    <nav class="smart-menu-overlay" id="menuOverlay">
        <ul>
            <li><a href="../トップ.html#top" class="menu-item">トップ</a></li>
            <li><a href="../トップ.html#about" class="menu-item">サイトについて</a></li>
            <li><a href="../トップ.html#origin" class="menu-item">言葉の起源</a></li>
            <li><a href="../トップ.html#kanji" class="menu-item">漢字</a></li>
        </ul>
    </nav>

    <div class="audio-notice" id="notice">右上の「音声を再生」を押すと、雨の音が流れ始めます</div>
    
    <button class="audio-control-btn" id="audioBtn" onclick="toggleAudio()">音声を再生</button>

    <div class="stage-container" id="stage"></div>

    <div class="meaning-modal" id="meaningModal">
        <div class="meaning-title" id="modalTitle">言葉</div>
        <div class="meaning-text" id="modalText">ここに言葉の意味が入ります。</div>
        <button class="meaning-close-btn" onclick="closeModal()">閉じる</button>
    </div>

    <script>
        // --------------------------------------------------
        // ③＆②：扉のアニメーション開始とメニューの制御
        // --------------------------------------------------
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                document.body.classList.add('loaded');
            }, 300);
        });

        const trigger = document.getElementById('menuTrigger');
        const overlay = document.getElementById('menuOverlay');
        const menuItems = document.querySelectorAll('.menu-item');

        function toggleMenu() {
            trigger.classList.toggle('active');
            overlay.classList.toggle('active');
        }

        trigger.addEventListener('click', toggleMenu);
        menuItems.forEach(item => item.addEventListener('click', toggleMenu));


        // --------------------------------------------------
        // 各言葉の意味データ
        // --------------------------------------------------
        const wordMeanings = {
            "四十過ぎての道楽と七つ下がって降る雨は止みそうで止まぬ": "○○○○○○○○○○○○という意味。",
            "櫛風沐雨": "○○○○○○○○○という意味。",
            "遣らずの雨": "○○○○○○○○○○○○○という意味。",
            "五風十雨": "○○○○○○○○という意味。",
            "雨夜の月": "○○○○○○○○○○○○○○○○という意味。。",
            "雨晴れて笠を忘れる": "○○○○○○○○○○○○○○○○○○○という意味。",
            "雨過天晴": "○○○○○○○○○○○○という意味。",
            "ポツポツ": "○○○○○○○○○○○○という意味。",
            "雨垂れ石を穿つ": "○○○○○○○○○○○○○○という意味。",
            "群雨": "○○○○○○○○○○○という意味。",
            "慈雨甘露": "○○○○○○○○○という意味。",
            "しとしと": "○○○○○○○という意味。。",
            "ザーザー": "○○○○○○○○○○○という意味。"
        };

        // 言葉ごとのエフェクト分類定義
        const wordEffects = {
            "四十過ぎての道楽と七つ下がって降る雨は止みそうで止まぬ": "default",
            "櫛風沐雨": "wind",
            "遣らずの雨": "default",
            "五風十雨": "wind",
            "雨夜の月": "quiet",
            "雨晴れて笠を忘れる": "sunny",
            "雨過天晴": "sunny",
            "ポツポツ": "quiet",
            "雨垂れ石を穿つ": "default",
            "群雨": "thunder",
            "慈雨甘露": "quiet",
            "しとしと": "quiet",
            "ザーザー": "thunder"
        };

        // --------------------------------------------------
        // Web Audio API を使った雨音・環境音生成システム
        // --------------------------------------------------
        let audioCtx = null;
        let whiteNoise = null;
        let filter = null;
        let gainNode = null;
        let isPlaying = false;
        let noiseBufferGlobal = null; 
        let thunderTimer = null; // 不規則な雷鳴用タイマー

        function toggleAudio() {
            const btn = document.getElementById('audioBtn');
            const notice = document.getElementById('notice');
            
            if (!isPlaying) {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const bufferSize = 2 * audioCtx.sampleRate;
                noiseBufferGlobal = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const output = noiseBufferGlobal.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                whiteNoise = audioCtx.createBufferSource();
                whiteNoise.buffer = noiseBufferGlobal;
                whiteNoise.loop = true;

                filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1000;
                filter.Q.value = 0.5;

                gainNode = audioCtx.createGain();
                gainNode.gain.value = 0.15;

                whiteNoise.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                whiteNoise.start();
                btn.innerText = "音声を停止";
                notice.style.opacity = '0';
                isPlaying = true;
                
                applyEnvironmentEffect(currentEffect);
            } else {
                stopThunderLoop();
                if (whiteNoise) {
                    whiteNoise.stop();
                    whiteNoise.disconnect();
                }
                btn.innerText = "音声を再生";
                isPlaying = false;
            }
        }

        // --- 雷のゴロゴロ音を生成 ---
        function playThunderSound() {
            if (!isPlaying || !audioCtx) return;

            const now = audioCtx.currentTime;
            const thunderSource = audioCtx.createBufferSource();
            thunderSource.buffer = noiseBufferGlobal;
            
            const lpFilter = audioCtx.createBiquadFilter();
            lpFilter.type = 'lowpass';
            // 鳴るたびに少しだけ周波数をランダムにして不規則感を強化
            lpFilter.frequency.setValueAtTime(120 + Math.random() * 60, now); 
            lpFilter.frequency.exponentialRampToValueAtTime(35, now + 1.8); 

            const thunderGain = audioCtx.createGain();
            thunderGain.gain.setValueAtTime(0.0, now);
            // 音量も毎回少し不規則にする
            const targetVolume = 0.4 + Math.random() * 0.3;
            thunderGain.gain.linearRampToValueAtTime(targetVolume, now + 0.04);  
            thunderGain.gain.linearRampToValueAtTime(targetVolume * 0.3, now + 0.25);   
            thunderGain.gain.linearRampToValueAtTime(targetVolume * 0.6, now + 0.45);   
            thunderGain.gain.exponentialRampToValueAtTime(0.001, now + 2.8); 

            thunderSource.connect(lpFilter);
            lpFilter.connect(thunderGain);
            thunderGain.connect(audioCtx.destination);
            
            thunderSource.start(now);
            thunderSource.stop(now + 2.9);
        }

        // --- ホバー中、不規則に雷をループ再生させる関数 ---
        function startThunderLoop() {
            stopThunderLoop(); // 重複防止
            playThunderSound(); // 1回目は即時再生

            function scheduleNext() {
                // 次の雷までの間隔を1.0秒〜3.5秒の間で不規則に変動させる
                const nextDelay = 1000 + Math.random() * 2500;
                thunderTimer = setTimeout(() => {
                    if (currentEffect === 'thunder') {
                        playThunderSound();
                        scheduleNext();
                    }
                }, nextDelay);
            }
            scheduleNext();
        }

        function stopThunderLoop() {
            if (thunderTimer) {
                clearTimeout(thunderTimer);
                thunderTimer = null;
            }
        }

        // --------------------------------------------------
        // 動的な環境エフェクト管理
        // --------------------------------------------------
        let currentEffect = 'default';
        let effectModifier = {
            lineRate: 1.0,
            phraseRate: 1.0
        };

        function applyEnvironmentEffect(type) {
            if (isModalOpen) return;
            currentEffect = type;

            const stage = document.getElementById('stage');
            stage.classList.remove('effect-thunder', 'effect-sunny', 'effect-wind', 'effect-quiet');
            if (type !== 'default') {
                stage.classList.add(`effect-${type}`);
            }

            const hasAudio = (isPlaying && audioCtx && gainNode && filter);
            const now = hasAudio ? audioCtx.currentTime : 0;

            // 雷モード以外になったらループを即座に遮断
            if (type !== 'thunder') {
                stopThunderLoop();
            }

            switch(type) {
                case 'thunder': // 激しい雨・雷雨
                    effectModifier.lineRate = 4.5;
                    effectModifier.phraseRate = 2.0;
                    if (hasAudio) {
                        gainNode.gain.setTargetAtTime(0.38, now, 0.15);
                        filter.frequency.setTargetAtTime(1400, now, 0.15);
                        filter.Q.setTargetAtTime(0.6, now, 0.1);
                        startThunderLoop(); // 不規則雷鳴ループの始動
                    }
                    break;
                case 'sunny': // 晴れ・雨上がり（日差し）
                    effectModifier.lineRate = 0.05;
                    effectModifier.phraseRate = 0.15;
                    if (hasAudio) {
                        gainNode.gain.setTargetAtTime(0.01, now, 0.4);
                        filter.frequency.setTargetAtTime(600, now, 0.4);
                        filter.Q.setTargetAtTime(0.4, now, 0.2);
                    }
                    break;
                case 'wind': // 強風・嵐
                    effectModifier.lineRate = 2.5;
                    effectModifier.phraseRate = 1.0;
                    if (hasAudio) {
                        gainNode.gain.setTargetAtTime(0.25, now, 0.2);
                        filter.frequency.setTargetAtTime(800, now, 0.2);
                        filter.Q.setTargetAtTime(2.2, now, 0.15);
                    }
                    break;
                case 'quiet': // ポツポツ・しとしと（よりまばらに）
                    effectModifier.lineRate = 0.15; // 線をさらに間引く
                    effectModifier.phraseRate = 0.25; // 言葉の落ちる確率を低下
                    if (hasAudio) {
                        gainNode.gain.setTargetAtTime(0.04, now, 0.3);
                        filter.frequency.setTargetAtTime(450, now, 0.3);
                        filter.Q.setTargetAtTime(0.3, now, 0.2);
                    }
                    break;
                default: // 通常の雨
                    effectModifier.lineRate = 1.2;
                    effectModifier.phraseRate = 1.0;
                    if (hasAudio) {
                        gainNode.gain.setTargetAtTime(0.18, now, 0.2);
                        filter.frequency.setTargetAtTime(1000, now, 0.2);
                        filter.Q.setTargetAtTime(0.5, now, 0.2);
                    }
                    break;
            }
        }

        // --------------------------------------------------
        // アニメーション＆ロジック
        // --------------------------------------------------
        const phrases = Object.keys(wordMeanings);
        const stage = document.getElementById('stage');
        let isModalOpen = false;

        function openModal(titleText, bodyText) {
            isModalOpen = true;
            document.getElementById('modalTitle').innerText = titleText;
            document.getElementById('modalText').innerText = bodyText;
            document.getElementById('meaningModal').classList.add('active');
            applyEnvironmentEffect('default');
        }

        function closeModal() {
            isModalOpen = false;
            document.getElementById('meaningModal').classList.remove('active');
        }

        // --- ①：言葉（文字）の生成 ---
        function createRainPhrase() {
            if (isModalOpen) return;
            if (Math.random() > effectModifier.phraseRate) return;

            const text = phrases[Math.floor(Math.random() * phrases.length)];
            const stageWidth = stage.clientWidth;
            const stageHeight = stage.clientHeight;
            const startX = Math.random() * (stageWidth - 80) + 40;
            
            const baseSpeed = (1.2 + Math.random() * 1.0) * 1.5; 
            const fadeStartThreshold = (stageHeight * (2 / 3)) + (Math.random() * 100 - 50);
            const phraseState = { isHovered: false };
            const charElements = [];

            for (let i = 0; i < text.length; i++) {
                const span = document.createElement('div');
                span.classList.add('rain-char');
                span.innerText = text[i];
                const dynamicFontSize = Math.max(16, stageWidth * 0.015);
                span.style.fontSize = `${dynamicFontSize}px`;

                const charObj = {
                    element: span,
                    x: startX,
                    y: -50 - ((text.length - 1 - i) * (dynamicFontSize + 4)),
                    speed: baseSpeed,
                    fadeStarted: false,
                    isDead: false
                };

                span.addEventListener('transitionend', (e) => {
                    if (e.propertyName === 'opacity') {
                        charObj.isDead = true;
                        span.remove();
                    }
                });

                span.addEventListener('mouseenter', () => {
                    if (isModalOpen) return;
                    phraseState.isHovered = true;
                    charElements.forEach(c => c.element.classList.add('phrase-paused'));
                    
                    const effectType = wordEffects[text] || 'default';
                    applyEnvironmentEffect(effectType);
                });

                span.addEventListener('mouseleave', () => {
                    phraseState.isHovered = false;
                    charElements.forEach(c => c.element.classList.remove('phrase-paused'));
                    
                    setTimeout(() => {
                        if (document.querySelectorAll('.rain-char:hover').length === 0) {
                            applyEnvironmentEffect('default');
                        }
                    }, 50);
                });

                span.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const currentMeaning = wordMeanings[text] || "意味が設定されていません。";
                    openModal(text, currentMeaning);
                });

                stage.appendChild(span);
                charElements.push(charObj);
            }

            function update() {
                if (isModalOpen) {
                    requestAnimationFrame(update);
                    return;
                }

                let allOut = true;

                charElements.forEach(char => {
                    if (char.isDead) return;
                    if (phraseState.isHovered) {
                        allOut = false;
                        return;
                    }

                    char.y += char.speed;

                    if (char.y > fadeStartThreshold && !char.fadeStarted) {
                        char.fadeStarted = true;
                        char.element.style.transition = 'opacity 1.5s linear, text-shadow 1.5s linear';
                        char.element.style.opacity = '0';
                        char.element.style.textShadow = 'none';
                    }

                    char.element.style.top = `${char.y}px`;
                    char.element.style.left = `${char.x}px`;
                    allOut = false;
                });

                if (!allOut) {
                    requestAnimationFrame(update);
                }
            }
            requestAnimationFrame(update);
        }

        // --- ②：雨の線（エフェクト）の生成 ---
        function createRainLine() {
            if (isModalOpen) return;

            const spawnCount = Math.floor(effectModifier.lineRate) + (Math.random() < (effectModifier.lineRate % 1) ? 1 : 0);
            
            for (let s = 0; s < spawnCount; s++) {
                const line = document.createElement('div');
                line.classList.add('rain-line');

                const stageWidth = stage.clientWidth;
                const stageHeight = stage.clientHeight;
                
                const depthFactor = 0.3 + Math.random() * 0.7;
                const startX = Math.random() * (stageWidth + 200) - 100;
                const length = (25 + Math.random() * 45) * depthFactor;
                const thickness = (0.7 + Math.random() * 1.5) * depthFactor;
                const speed = (6 + Math.random() * 6) * depthFactor * 1.5;
                const opacity = (0.35 + Math.random() * 0.45) * depthFactor; // 全体的に不透明度を高めてくっきりと

                line.style.left = `${startX}px`;
                line.style.width = `${thickness}px`;
                line.style.height = `${length}px`;
                line.style.opacity = opacity;

                if (currentEffect === 'wind') {
                    line.style.transform = 'rotate(15deg)';
                } else {
                    line.style.transform = 'none';
                }

                let currentY = -length;
                let currentX = startX;
                stage.appendChild(line);

                function updateLine() {
                    if (isModalOpen) {
                        requestAnimationFrame(updateLine);
                        return;
                    }

                    currentY += speed;
                    if (currentEffect === 'wind') {
                        currentX -= speed * Math.tan(15 * Math.PI / 180);
                        line.style.left = `${currentX}px`;
                    }

                    line.style.top = `${currentY}px`;

                    if (currentY < stageHeight) {
                        requestAnimationFrame(updateLine);
                    } else {
                        line.remove();
                    }
                }
                requestAnimationFrame(updateLine);
            }
        }

        setInterval(createRainPhrase, 800);
        setInterval(createRainLine, 40);
        
        setTimeout(createRainPhrase, 200);
        setTimeout(createRainPhrase, 800);
    </script>
</body>
</html>
