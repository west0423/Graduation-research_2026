     <script>
window.addEventListener("DOMContentLoaded", () => {
  // 星を表示するための親要素を取得
  const stars = document.querySelector(".stars");

  // 星を生成する関数
  const createStar = () => {
    const starEl = document.createElement("span");
    starEl.className = "star";
    const minSize = 1; // 星の最小サイズを指定
    const maxSize = 2; // 星の最大サイズを指定
    const size = Math.random() * (maxSize - minSize) + minSize;
    starEl.style.width = `${size}px`;
    starEl.style.height = `${size}px`;
    starEl.style.left = `${Math.random() * 100}%`;
    starEl.style.top = `${Math.random() * 100}%`;
    starEl.style.animationDelay = `${Math.random() * 10}s`;
    stars.appendChild(starEl);
  };

  // for文で星を生成する関数を指定した回数呼び出す
  for (let i = 0; i <= 500; i++) {
    createStar();
  }
});
     </script>





<!-- 効果音 -->
        <div class="layer">
          <button id="playButton" class="close-btn">
            This website plays music.
          </button>
      </div>

        <script>
            const sounds = [{src: "bgm.mp3",volume: 0.2},];

            const initVol = sounds[0].volume;

// Howlインスタンスを作成
const howls = sounds.map(
  (sound) =>
    new Howl({
      src: sound.src,
      loop: true,
      volume: sound.volume,
    })
);

// ボタンとレイヤーの要素を取得
const playButton = document.getElementById("playButton");
const layer = document.querySelector(".layer");

// ボタンクリック時の処理
playButton.addEventListener("click", () => {
  // 1. 音声を再生開始
  howls.forEach((howl) => howl.play());

  // 2. レイヤーを消す
  layer.style.display = "none";
});

// スクロールイベントリスナー
window.addEventListener("scroll", () => {
  const scrollY = window.scrollY;
  const height = document.documentElement.scrollHeight - window.innerHeight;
  const ratio = scrollY / height;

  howls.forEach((howl, index) => {
    howl.volume(initVol * (index === 0 ? 1 - ratio : ratio));
  });
});
</script>

<canvas id="c"></canvas>

        <script>
let App = ((window) => {
        let width, height, ctnX, ctnY, teleScopeR;
        let cv = document.getElementById('c');
        let ctx = cv.getContext('2d');


        let initSize = () => {
            width = window.innerWidth;
            height = window.innerHeight;
            cv.width = width;
            cv.height = height;
            ctnX = width / 2;
            ctnY = height / 2;
            teleScopeR = width > height ? width / 4 : height / 4;
        };

        let teleScope = (e) => {
            let x, y;
            try {
                x = e.clientX;
                y = e.clientY;
            } catch (error) {
                x = ctnX;
                y = ctnY;
            }

            ctx.beginPath();
            ctx.arc(x, y, teleScopeR, 0, 2 * Math.PI, false);
            ctx.fill();
            ctx.fillStyle = "#000";
            ctx.clearRect(0, 0, cv.width, cv.height);
            ctx.fillRect(0, 0, cv.width, cv.height);
            ctx.clip();

        };

        let start = (e) => {
            ctx.save();
            teleScope(e);
            ctx.restore();
        };

        return {
            run : () => {
                initSize();
                start();
     
                 window.addEventListener('mousemove', start);
                window.addEventListener('resize', initSize);
            }
        };

    })(window);

    App.run();
        </script>
